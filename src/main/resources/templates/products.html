<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ürünler · İntaş ERP</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header th:replace="~{fragments/layout :: header('urunler')}"></header>

    <div class="wrap">
      <div class="row">
        <div>
          <h1>Ürünler</h1>
          <span class="muted" th:text="|Toplam ${total} ürün|">Toplam 0 ürün</span>
        </div>
        <form class="inline" method="post" action="/urunler/ice-aktar" enctype="multipart/form-data">
          <input type="file" name="file" accept=".xls,.xlsx" required />
          <button type="submit">Excel'den İçe Aktar</button>
        </form>
      </div>

      <div th:if="${message}" class="flash ok" th:text="${message}"></div>
      <div th:if="${error}" class="flash err" th:text="${error}"></div>

      <div class="card">
        <form class="inline" method="get" action="/urunler">
          <input
            type="search"
            name="q"
            th:value="${q}"
            placeholder="Ürün adı veya kodu ara..." />
          <button type="submit">Ara</button>
          <a th:if="${q != null and !q.isEmpty()}" class="btn ghost" href="/urunler">Temizle</a>
        </form>

        <div th:if="${products.totalElements == 0}" class="empty">
          <p th:if="${q == null or q.isEmpty()}">
            Henüz ürün yok. Yukarıdan Go Plus Excel dökümünü içe aktarın.
          </p>
          <p th:unless="${q == null or q.isEmpty()}">Bu aramaya uygun ürün bulunamadı.</p>
        </div>

        <table th:if="${products.totalElements > 0}">
          <thead>
            <tr>
              <th>Kod</th>
              <th>Ürün</th>
              <th>Birim</th>
              <th>Tedarikçi</th>
              <th class="num">Stok</th>
              <th class="num">Fiyat</th>
              <th>Koli</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${products.content}">
              <td class="code" th:text="${p.code}">KOD</td>
              <td th:text="${p.name}">Ürün adı</td>
              <td th:text="${p.unit}">ADET</td>
              <td class="muted" th:text="${p.supplier}">Tedarikçi</td>
              <td class="num" th:classappend="${p.stock == 0} ? 'stock-zero'" th:text="${p.stock}">0</td>
              <td class="num" th:text="${p.price != null ? p.price + ' ₺' : '—'}">—</td>
              <td class="muted" th:text="${p.unitsPerCarton != null ? '1 ' + (p.cartonUnit != null ? p.cartonUnit : 'KOLİ') + ' = ' + p.unitsPerCarton : '—'}">—</td>
              <td class="inline" style="gap: 10px">
                <a class="edit" th:href="@{'/urunler/' + ${p.id} + '/duzenle'}">Düzenle</a>
                <a class="edit" th:href="@{'/urunler/' + ${p.id} + '/hareketler'}">Hareketler</a>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="pager" th:if="${products.totalPages > 1}">
          <a
            th:classappend="${!products.hasPrevious()} ? 'disabled'"
            th:href="@{/urunler(q=${q}, page=${products.number - 1})}"
            >← Önceki</a>
          <span th:text="|Sayfa ${products.number + 1} / ${products.totalPages}|">Sayfa 1 / 1</span>
          <a
            th:classappend="${!products.hasNext()} ? 'disabled'"
            th:href="@{/urunler(q=${q}, page=${products.number + 1})}"
            >Sonraki →</a>
        </div>
      </div>
    </div>
  </body>
</html>
