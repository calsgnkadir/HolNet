<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yeni Cari · İntaş ERP</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="top">
      <span class="logo">İNTAŞ <b>ERP</b></span>
      <nav>
        <a href="/urunler">Ürünler</a>
        <a href="/satis">Satış</a>
        <a href="/satislar">Satışlar</a>
        <a href="/cari" class="active">Cari</a>
      </nav>
    </header>

    <div class="wrap">
      <div class="row">
        <div><h1>Yeni Cari Hesap</h1></div>
        <a class="btn ghost" href="/cari">← Listeye dön</a>
      </div>

      <div th:if="${error}" class="flash err" th:text="${error}"></div>

      <div class="card">
        <form method="post" action="/cari/yeni" class="grid-form">
          <label>
            <span>Cari adı *</span>
            <input class="grow" type="text" name="name" required placeholder="örn. SALİH KILIÇ / ÇERKEZKÖY" />
          </label>
          <label>
            <span>Kod (boş = otomatik)</span>
            <input type="text" name="code" placeholder="120.01.xxx" />
          </label>
          <label>
            <span>Şehir</span>
            <input type="text" name="city" />
          </label>
          <label>
            <span>Telefon</span>
            <input type="text" name="phone" />
          </label>
          <label>
            <span>Açılış bakiyesi (₺, borç +)</span>
            <input type="text" name="openingBalance" placeholder="örn. 1.500,00 — boş = 0" inputmode="decimal" />
          </label>
          <div class="span2 hint">
            Bakiye kuralı: <b>pozitif = borç</b> (müşteri size borçlu), negatif = alacak.
            Satış cariyi borçlandırır, tahsilat düşer.
          </div>
          <div class="span2 inline">
            <button type="submit" class="btn big">Kaydet</button>
            <a class="btn ghost" href="/cari">Vazgeç</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
