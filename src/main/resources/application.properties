spring.application.name=intas-erp

# Dev database: H2 in FILE mode → data persists to ./data/intaserp.mv.db with zero
# install. Switching to MySQL later is just this block + the mysql driver.
spring.datasource.url=jdbc:h2:file:./data/intaserp;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at /h2 (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Thymeleaf: no template cache in dev so edits show on refresh
spring.thymeleaf.cache=false

# The Go Plus Excel export is ~1.5 MB; allow comfortable headroom
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# HTTPS — telefon kamerasıyla barkod okutmak için ZORUNLU (tarayıcı kamerayı
# yalnızca localhost veya https'te açar). Kendinden imzalı sertifika; telefon ilk
# girişte "güvenli değil" uyarısı verir, "yine de devam et" denir (kendi ağınız).
# Sertifikayı yenilemek için: keytool -genkeypair ... -ext "SAN=...,ip:<yeni-ip>"
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=intaserp
